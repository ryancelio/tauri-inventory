name: 'publish'

on:
  push:
    branches:
      - 'release'
    # paths:
      # - 'apps/pos/**'
      # - 'packages/types/**'
      # - 'package.json'
    paths-ignore:
        - 'apps/api/**'

# This workflow will trigger on each push to the `release` branch to create or update a GitHub release, build your app, and upload the artifacts to the release.

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      # libsqlite3-sys is built with the `bundled-sqlcipher` feature, which
      # compiles SQLCipher and needs OpenSSL headers. GitHub's Windows runners
      # don't ship OpenSSL (that's the "OPENSSL_DIR is not set" error), so
      # install a prebuilt static OpenSSL via vcpkg (preinstalled on the
      # runner) and point the openssl-sys crate at it. Static CRT linkage
      # keeps OpenSSL out of the installer's runtime DLLs.
      - name: install OpenSSL (windows only)
        if: matrix.platform == 'windows-latest'
        run: |
          $vcpkgRoot = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          & "$vcpkgRoot\vcpkg.exe" install openssl:x64-windows-static-md
          "OPENSSL_DIR=$vcpkgRoot\installed\x64-windows-static-md" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "OPENSSL_STATIC=1" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # This is an npm-workspaces monorepo (package-lock.json at the repo root).
      # Install must run from the root so the shared `@tauri-inventory/types`
      # workspace is linked into node_modules — running `npm ci` inside
      # apps/pos never materializes it, which breaks every import of
      # "@tauri-inventory/types". Only the workspaces needed for the Tauri
      # build are installed; the API workspace (native deps) is skipped.
      - name: install frontend dependencies
        run: npm ci -w @tauri-inventory/pos -w @tauri-inventory/types

      # The types package ships from ./dist (its main/types fields point at
      # dist/*, which is gitignored), so it must be compiled before the build.
      - name: build shared types
        run: npm run build:types

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required to sign the updater artifacts (createUpdaterArtifacts:
          # true in apps/pos/src-tauri/tauri.conf.json). Add the same key used
          # by `tauri signer generate` as the two repository secrets below.
          # NOTE: TAURI_SIGNING_PRIVATE_KEY must be the single-line base64
          # string printed by `tauri signer generate` (e.g.
          # "dW50cnVzdGVkIGNvbW1lbnQ6..."). It must be valid base64: no PEM
          # headers (-----BEGIN...), no file path, no quotes, no newlines. A
          # value that isn't base64 fails the build with "failed to decode
          # base64 secret key: Invalid symbol <n>, offset <m>".
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version.
          releaseName: 'App v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          # Must be published for the `releases/latest/download/latest.json`
          # endpoint in tauri.conf.json to resolve.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          projectPath: 'apps/pos'
